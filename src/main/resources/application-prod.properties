# mongodb
%prod.quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING}
%prod.quarkus.mongodb.database=${MONGODB_DATABASE}

# argon2id password hashing
%prod.password.argon2.memory-kb=8192
%prod.password.argon2.iterations=2
%prod.password.argon2.parallelism=1

# cors
%prod.quarkus.http.cors.enabled=true
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}
%prod.quarkus.http.cors.access-control-allow-credentials=true
%prod.quarkus.http.cors.headers=accept,authorization,content-type
%prod.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# jwk authentication
%prod.mp.jwt.verify.issuer=${JWT_ISSUER}
%prod.smallrye.jwt.verify.key-format=JWK
%prod.smallrye.jwt.verify.algorithm=HS256
%prod.smallrye.jwt.verify.key.location=file:///work/secret.jwk
%prod.smallrye.jwt.sign.key.location=file:///work/secret.jwk
%prod.jwt.expires-seconds=${JWT_EXPIRES_SECONDS:86400}

# google sign-in
%prod.google.client-id=${GOOGLE_CLIENT_ID}

# oidc: PocketID
%prod.oidc.issuer=${OIDC_ISSUER:__unset__}
%prod.oidc.client-id=${OIDC_CLIENT_ID:__unset__}
%prod.oidc.jwks-uri=${OIDC_JWKS_URI:__unset__}